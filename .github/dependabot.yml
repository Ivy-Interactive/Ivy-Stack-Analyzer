# Dependabot version updates: one grouped pull request per ecosystem a week.
# Security updates are switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/src/Ivy.StackAnalyzer.Test/Fixtures/django-spa/frontend"
      - "/src/Ivy.StackAnalyzer.Test/Fixtures/next-dotnet-monorepo/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/src/Ivy.StackAnalyzer"
      - "/src/Ivy.StackAnalyzer.Console"
      - "/src/Ivy.StackAnalyzer.Test"
      - "/src/Ivy.StackAnalyzer.Test/Fixtures/next-dotnet-monorepo/src/Api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directories:
      - "/src/Ivy.StackAnalyzer.Test/Fixtures/django-spa/backend"
      - "/src/Ivy.StackAnalyzer.Test/Fixtures/numpy-style-lib"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directories:
      - "/src/Ivy.StackAnalyzer.Test/Fixtures/go-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gomod:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/src/Ivy.StackAnalyzer.Test/Fixtures/go-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
