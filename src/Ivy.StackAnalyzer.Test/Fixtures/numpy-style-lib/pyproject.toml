[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mylib"
version = "0.1.0"
description = "A small numerical helper library."
dependencies = [
    "numpy>=2.5.5",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "mypy>=2.4.1"]
